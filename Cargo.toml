[package]
name = "Bachelor-Assurance"
version = "0.1.0"
edition = "2024"

[lib]
name = "bachelor_assurance"

[dependencies]
hax-lib = { git = "https://github.com/hacspec/hax", version = "0.3.6" }
libcrux = { version = "0.0.2-pre.2", features = ["rand"] }
rand = "0.10.0"
stacker = "0.1.24"
rayon = "1.12.0"
lib = "0.0.2"

[target."cfg(hax)".dependencies]
hax-lib = { git = "https://github.com/hacspec/hax", version = "0.3.6" }

[features]
lambda_128s = []
lambda_128f = []
lambda_192s = []
lambda_192f = []
lambda_256s = []
lambda_256f = []
default = ["lambda_128s"]
hax = []

